situation.DEP_MISSING.title=Une dépendance obligatoire manque
situation.DEP_MISSING.advice=Installez {0}. Il est exigé par {1}.
situation.DEP_VERSION.title=Une dépendance n'a pas la bonne version
situation.DEP_VERSION.advice={1} a besoin de {0} en version {2}, mais c'est {3} qui est installé. Mettez-le à jour ou changez de version.
situation.DEP_CYCLE.title=Dépendances circulaires
situation.DEP_CYCLE.advice=Ces mods ou plugins dépendent les uns des autres. Mettez-les à jour ou retirez-en un.
situation.WRONG_LOADER.title=Mod fait pour un autre loader
situation.WRONG_LOADER.advice=Retirez {0} : il n'est pas fait pour {1}. Téléchargez la version {1} si elle existe.
situation.WRONG_MC.title=Fait pour une autre version de Minecraft
situation.WRONG_MC.advice={0} est fait pour Minecraft {2}, mais ce serveur tourne en Minecraft {1}. Téléchargez la version de {0} faite pour Minecraft {1}.
situation.DUPLICATE.title=Installé en double
situation.DUPLICATE.advice={0} est installé plusieurs fois ({1}). Gardez uniquement le fichier le plus récent.
situation.JAVA_VERSION.title=Mauvaise version de Java
situation.JAVA_VERSION.advice=Lancez le jeu ou le serveur avec Java {0} ou plus récent (actuellement Java {1}).
situation.CLIENT_ONLY_ON_SERVER.title=Mod client installé sur un serveur
situation.CLIENT_ONLY_ON_SERVER.advice=Retirez {0} du serveur : il ne fonctionne que dans le jeu (client).
situation.MIXIN_CONFLICT.title=Un mod n'a pas réussi à modifier le jeu (mixin)
situation.MIXIN_CONFLICT.advice={0} n'a pas pu appliquer ses modifications au jeu. C'est souvent un conflit avec un autre mod ou une version inadaptée : mettez {0} à jour, puis lancez une recherche du coupable si ça continue.
situation.PLUGIN_API.title=Un plugin ne peut pas se charger
situation.PLUGIN_API.advice=Vérifiez que {0} est fait pour ce logiciel de serveur et cette version de Minecraft, et que ses dépendances sont installées.
situation.CORRUPT_JAR.title=Fichier corrompu
situation.CORRUPT_JAR.advice=Retéléchargez {0} depuis sa page officielle.
situation.CONFIG_BROKEN.title=Fichier de configuration cassé
situation.CONFIG_BROKEN.advice=Supprimez ou corrigez {0} ; il sera recréé avec les valeurs par défaut.
situation.DATAPACK_BROKEN.title=Un datapack est invalide
situation.DATAPACK_BROKEN.advice=Un datapack (ou les données d'un mod) contient un fichier que le jeu ne sait pas lire : {0}. Retirez ou corrigez le datapack dans le dossier datapacks du monde.
situation.REGISTRY_MISMATCH.title=Contenu différent entre client et serveur
situation.REGISTRY_MISMATCH.advice=Installez exactement les mêmes mods, dans les mêmes versions, côté client et côté serveur.
situation.MOD_MISMATCH.title=Mods différents entre client et serveur
situation.MOD_MISMATCH.advice=Installez exactement les mêmes mods, dans les mêmes versions, côté client et côté serveur.
situation.CORRUPT_CHUNK.title=Chunk corrompu
situation.CORRUPT_CHUNK.advice=Le chunk {0} de {1} est illisible. Le jeu le génère à nouveau et ce qui y était construit est perdu. Arrêtez le serveur et restaurez {1}/{2} depuis une sauvegarde ; sans sauvegarde, gardez d'abord une copie de ce fichier.
situation.CORRUPT_ENTITY.title=Entité corrompue
situation.CORRUPT_ENTITY.advice=Les entités du chunk {0} de {1} (animaux, cadres, supports d'armure, objets au sol) sont illisibles et perdues à son chargement. Arrêtez le serveur et restaurez {1}/{2} depuis une sauvegarde.
situation.CORRUPT_PLAYERDATA.title=Données de joueur corrompues
situation.CORRUPT_PLAYERDATA.advice=La sauvegarde de {0} est illisible : en se connectant, le joueur repart de zéro avec un inventaire vide. Arrêtez le serveur, puis restaurez ce fichier depuis une sauvegarde, ou renommez la sauvegarde précédente <uuid>.dat_old en <uuid>.dat si elle existe.
situation.TICK_ENTITY.title=Crash pendant la mise à jour d'une entité
situation.TICK_ENTITY.advice=L'entité {0} en {1} a fait planter le jeu. {2} est la cause probable : mettez-le à jour, ou supprimez cette entité.
situation.TICK_BLOCK_ENTITY.title=Crash pendant la mise à jour d'un bloc
situation.TICK_BLOCK_ENTITY.advice=Le bloc {0} en {1} a fait planter le jeu. {2} est la cause probable : mettez-le à jour, ou cassez ce bloc.
situation.OUT_OF_MEMORY.title=Mémoire insuffisante
situation.OUT_OF_MEMORY.advice=Donnez plus de mémoire à Java (-Xmx) ou retirez des mods lourds. Un gros modpack demande en général 6 à 10 Go.
situation.STACK_OVERFLOW.title=Boucle infinie (dépassement de pile)
situation.STACK_OVERFLOW.advice={0} est parti dans une boucle infinie. Mettez-le à jour ; si ça continue, signalez-le à son auteur.
situation.RENDER.title=Problème graphique
situation.RENDER.advice=Mettez à jour vos pilotes graphiques, désactivez les shaders et packs de ressources, puis réessayez.
situation.NATIVE_CRASH.title=Crash de Java lui-même
situation.NATIVE_CRASH.advice=Mettez à jour Java et vos pilotes. Le crash s'est produit dans {0}.
situation.HANG.title=Le thread principal est bloqué
situation.HANG.advice={0} bloque le thread principal : le serveur se fige et le watchdog finit par l'arrêter. Mettez à jour ou retirez {0}.
situation.DEADLOCK.title=Deux threads s'attendent mutuellement
situation.DEADLOCK.advice={0} tient un verrou qu'un autre de ses threads attend, pendant que ce thread tient celui qu'attend le thread principal : le serveur est figé pour de bon et le watchdog l'arrête. Signalez-le à l'auteur de {0} avec ce journal, et mettez-le à jour ou retirez-le.
situation.LAG.title=Gros lag
situation.LAG.advice={0} utilise l'essentiel du temps de chaque tick.
situation.LOG_SPAM.title=Journal inondé
situation.LOG_SPAM.advice={0} écrit la même erreur en boucle.
situation.SILENT_ERROR.title=Erreur silencieuse
situation.SILENT_ERROR.advice={0} a échoué {1} fois pendant que le serveur tournait. Rien n'a planté, mais la fonctionnalité qu'il apporte est cassée : mettez {0} à jour ou signalez l'erreur à son auteur.
situation.UNCAUGHT_EXCEPTION.title=Erreur non gérée
situation.UNCAUGHT_EXCEPTION.advice=L'erreur vient de {0}. Mettez-le à jour ; si ça continue, signalez le journal à son auteur.
situation.MOD_CONFLICT.title=Mods incompatibles
situation.MOD_CONFLICT.advice={0} ne peut pas fonctionner avec {1}. Retirez l'un des deux, ou cherchez des versions compatibles entre elles.
situation.WORLD_DOWNGRADE.title=Monde ouvert avec un Minecraft plus ancien
situation.WORLD_DOWNGRADE.advice=Ce monde a été sauvegardé par un Minecraft plus récent ({0}) que celui du serveur ({1}). Mettez le serveur à jour, ou restaurez une sauvegarde d'avant la mise à jour : un monde ne peut pas revenir à une version plus ancienne.
situation.WORLD_DUPLICATE.title=Deux mondes avec la même identité
situation.WORLD_DUPLICATE.advice={0} est une copie d'un autre monde. Supprimez le fichier uid.dat dans le dossier {0}, puis redémarrez.
signature.world-missing-mod.advice=Le monde contient du contenu de {0}, qui n'est plus installé. Réinstallez {0}, ou acceptez que ses blocs et objets disparaissent (faites une sauvegarde avant).
signature.world-mod-version.advice=Le monde a été sauvegardé avec une autre version de {0}. Lisez le changelog de {0} avant de jouer, et gardez une sauvegarde.
signature.fml-confirm.advice=Le monde fait référence à des blocs ou objets qui n'existent plus (un mod a été retiré ou modifié). Le serveur attend /fml confirm : faites une sauvegarde, puis confirmez, ou réinstallez le mod manquant.
signature.authme-shutdown.advice=AuthMe arrête le serveur volontairement, en général parce qu'il n'arrive pas à joindre sa base de données. Vérifiez les réglages de base de données dans la configuration d'AuthMe.
report.skipped={0} fichier(s) du pack n'ont pas pu être vérifiés ({1}) : CurseForge ne sert ses fichiers que par son API. Vérifiez plutôt le dossier installé.
bisect.notReproduced=Le serveur a démarré normalement avec tous ses mods et plugins : il n'y a rien à chercher. Si le crash arrive plus tard en jeu, relancez avec --with-world et un --settle plus long.
bisect.reproduced=Crash reproduit
bisect.unexplained=le serveur s'arrête sans aucune explication dans ses journaux
bisect.single=Coupable trouvé : {0}. Le serveur plante avec lui seul et démarre sans lui.
bisect.combination=Le crash demande tous ceux-ci ensemble : {0}. Sans l'un d'eux, le serveur démarre normalement : ils sont incompatibles entre eux.
bisect.incomplete=La limite de {0} lancements a été atteinte avant la fin. Le coupable est parmi : {1}. Relancez avec un --max-runs plus élevé.
bisect.cost={0} lancements, {1} minutes.
signature.paper-remap-failed.advice={0} n'est pas chargé du tout : Paper n'a pas pu le préparer, car son remappeur ne sait pas lire certaines de ses classes (compilées pour une Java plus récente). Le serveur démarre, mais sans {0}. Installez la version de {0} faite pour cette version de Minecraft, ou mettez Paper à jour.
mixin.suspects.advice=L'erreur s'est produite dans du code de Minecraft que {0} modifie par des mixins : c'est le premier suspect, pas une preuve. Confirmez avec crashsleuth bisect.
situation.EULA.title=L'EULA de Minecraft n'est pas acceptée
situation.EULA.advice=Ouvrez eula.txt dans le dossier du serveur et mettez eula=true, après avoir lu https://aka.ms/MinecraftEULA. D'ici là, le serveur s'arrête au démarrage.
situation.PORT_IN_USE.title=Le port du serveur est déjà pris
situation.PORT_IN_USE.advice=Un autre programme (souvent une deuxième copie du serveur) utilise déjà ce port. Arrêtez-le, ou changez server-port dans server.properties.
situation.DISK_FULL.title=Le disque est plein
situation.DISK_FULL.advice=Le serveur ne peut plus écrire ses fichiers. Libérez de la place (anciennes sauvegardes, journaux, crash reports) avant de le relancer, sinon le monde risque d'être abîmé.
situation.JVM_OPTIONS.title=Java refuse les options de démarrage
situation.JVM_OPTIONS.advice=La commande de démarrage ou user_jvm_args.txt contient une option que cette Java n'accepte pas. Retirez-la ou corrigez-la.
situation.WORLD_LOCKED.title=Le monde est déjà utilisé
situation.WORLD_LOCKED.advice=Un autre serveur (ou une copie de celui-ci mal arrêtée) tient déjà le monde {0}. Arrêtez-le avant de lancer celui-ci ; ne lancez jamais deux serveurs sur le même monde.
situation.WORLD_CORRUPT.title=Le fichier du monde est abîmé
situation.WORLD_CORRUPT.advice=Le level.dat de {0} est illisible. Restaurez-le depuis une sauvegarde, ou renommez level.dat_old en level.dat s'il existe (c'est la sauvegarde précédente).
signature.heap-too-big.advice=Java ne peut pas obtenir la mémoire demandée par -Xmx : l'ordinateur ou le conteneur en a moins. Baissez -Xmx dans la commande de démarrage ou dans user_jvm_args.txt.
signature.config-broken.advice=La configuration de {0} est illisible. Supprimez le fichier pour qu'il soit recréé avec les valeurs par défaut, ou corrigez la ligne indiquée dans les preuves.
situation.OUTDATED.title=Une version plus récente existe
situation.OUTDATED.advice=Une version plus récente de {0} existe pour ce jeu et ce loader ({1}). Les mises à jour corrigent souvent des crashs : lisez son changelog avant de mettre à jour.
compare.missing-on-player=Le serveur a {0}, qui ajoute des blocs et des objets, mais pas le joueur : le jeu refuse la connexion. Installez la même version de {0} dans le jeu du joueur.
compare.missing-on-server=Le joueur a {0}, qui ajoute des blocs et des objets, mais pas le serveur : le jeu refuse la connexion. Retirez {0} du jeu du joueur, ou installez-le sur le serveur.
compare.version=Le joueur a {0}, le serveur la version {2}. Installez la même version des deux côtés.
compare.loader=Le joueur utilise {1} et le serveur {2} : les mods d'un loader ne se connectent pas à l'autre. Utilisez le loader du serveur.
compare.minecraft=Le joueur lance Minecraft {1} et le serveur Minecraft {2}. Lancez le jeu dans la version du serveur.
situation.PROXY_FORWARDING.title=Le proxy et le serveur ne se font pas confiance
situation.PROXY_FORWARDING.advice=Le proxy transmet les joueurs avec un secret que le serveur n'accepte pas, ou dans un mode qu'il n'attend pas. Mettez le même secret de transfert dans le proxy (forwarding.secret) et dans le serveur (config/paper-global.yml, proxies.velocity.secret), et le même mode de transfert des deux côtés.
situation.PROXY_BACKEND.title=Le proxy n'arrive pas à joindre le serveur
situation.PROXY_BACKEND.advice=Le proxy n'a pas pu se connecter à {0}. Démarrez ce serveur, et vérifiez l'adresse et le port dans la configuration du proxy (velocity.toml [servers] ou config.yml).
situation.CONNECTION_LOST.title=Le joueur a été déconnecté
situation.CONNECTION_LOST.advice=La connexion a été fermée : {1}. Lisez la raison dans les preuves ; si elle cite un mod ou un registre, comparez les mods du joueur et du serveur.
signature.registry-unknown.advice=Le serveur a des mods qui ajoutent des blocs ou des objets que le joueur n'a pas. Installez dans le jeu du joueur les mêmes mods de contenu, dans les mêmes versions, que le serveur ; comparer les deux dossiers les nomme.
lag.no-profile=Le serveur a pris jusqu'à {5} ms de retard (vu {6} fois après le démarrage) : quelque chose prend trop de temps à chaque tick. Le journal ne dit pas quoi : pendant le lag, lancez spark profiler start --timeout 60 --save-to-file dans la console, puis donnez le fichier .sparkprofile enregistré (plugins/spark ou config/spark) à CrashSleuth.
lag.profile={0} prend {3} % du temps du thread principal (surtout dans {4}). Vérifiez ses réglages (intervalles, rayons, quantités), mettez-le à jour, ou retirez-le pour confirmer.
signature.killed.advice=Le système a tué Java : la machine ou le conteneur a moins de mémoire que ce que Java a le droit de prendre (-Xmx, plus environ 1 Go pour Java lui-même). Baissez -Xmx, ou donnez plus de mémoire au conteneur.
render.pack-unreadable=Le pack de ressources {0} n'est pas un pack que le jeu sait ouvrir (téléchargement abîmé, ou dossier zippé un niveau trop profond). Le jeu l'a retiré de ses options. Téléchargez-le à nouveau ; un fichier pack.mcmeta doit se trouver à la racine du zip.
render.pack-broken=Des fichiers de {0} sont illisibles (modèles ou états de blocs au JSON cassé, vus {6} fois) : ces blocs ou objets s'affichent comme manquants. Mettez le pack à jour, ou retirez-le pour confirmer.
render.shaderpack=Le pack de shaders {0} ne se compile pas sur cet ordinateur ({4}), Iris a donc désactivé les shaders. Mettez le pack à jour, prenez une version faite pour cet Iris, ou mettez à jour le pilote graphique.
signature.natives-missing.advice=Les bibliothèques natives du jeu (LWJGL) manquent pour ce système : Minecraft ne les fournit pas pour tous les ordinateurs (Linux sur ARM, par exemple). Utilisez un launcher qui les fournit pour ce système (Prism Launcher le fait), ou un ordinateur à processeur x86-64.
report.explanation=En termes simples (IA locale, elle peut se tromper : le diagnostic ci-dessus fait foi) :
report.explanation.none=Aucune IA locale n'a répondu à {0}. Lancez Ollama avec un modèle, ou indiquez votre serveur local dans CRASHSLEUTH_AI_URL.
proxy.waterfall-eol=Waterfall n'est plus maintenu (PaperMC l'a arrêté en 2024) et ne reçoit plus de correctifs : lors d'un test, il a laissé un joueur attendre sans aucun message quand son serveur était éteint. Passez à Velocity.
render.drawing={0} a fait planter le jeu pendant qu'il dessinait le monde ({4}). Retirez-le pour rejouer, puis mettez-le à jour ou signalez le crash à son auteur avec ce rapport.
render.what.blocks=les blocs
render.what.entity=une entité
render.what.block entity=un bloc spécial
render.what.screen=l'interface
render.what.item=un objet
ai.invented=CrashSleuth ne connaît pas ceci, ne vous y fiez pas : {0}
advice.folia.unsupported=Folia ne charge que les plugins qui annoncent folia-supported. Demandez une version Folia de {0} \u00e0 son auteur, ou utilisez Paper.
advice.plugin.old-internals={0} cherche dans le serveur quelque chose que cette version de Minecraft n'a plus : il est fait pour une autre version. Mettez {0} \u00e0 jour, ou utilisez la version de Minecraft qu'il prend en charge.
signature.velocity-secret-file-empty.advice=Le fichier indiqu\u00e9 par forwarding-secret-file (forwarding.secret) est vide. \u00c9crivez-y le m\u00eame secret que sur les serveurs derri\u00e8re le proxy, ou mettez player-info-forwarding-mode \u00e0 none.
signature.velocity-config-unreadable.advice=Velocity n'a pas pu lire velocity.toml et s'est arr\u00eat\u00e9. Corrigez la ligne qu'il indique, ou supprimez le fichier pour qu'il en \u00e9crive un neuf.
signature.forge-language-provider-version.advice={0} demande un language provider que cette version de NeoForge ou Forge ne fournit pas : il est fait pour une autre version du loader. Installez la version du loader qu'il indique, ou mettez le mod \u00e0 jour.
signature.jar-invalid-or-corrupt.advice=Ce jar n'est pas complet : le t\u00e9l\u00e9chargement s'est arr\u00eat\u00e9 en route. Supprimez-le et t\u00e9l\u00e9chargez-le \u00e0 nouveau.
signature.file-access-denied.advice=Le serveur n'a pas le droit de lire ou d'\u00e9crire ce fichier. Donnez-le \u00e0 l'utilisateur qui fait tourner le serveur (chown), ou, dans un conteneur, r\u00e9glez UID et GID sur le propri\u00e9taire du dossier.
signature.mod-metadata-invalid.advice=Le loader n'arrive pas \u00e0 lire ce que {0} dit de lui-m\u00eame : cette version a \u00e9t\u00e9 publi\u00e9e cass\u00e9e. Prenez-en une autre, ou signalez-le \u00e0 son auteur.
signature.connector-locator-error.advice=Connector n'a pas r\u00e9ussi \u00e0 lire un des mods Fabric qu'il devait convertir, et plus rien ne s'est charg\u00e9. Prenez une version plus r\u00e9cente de Connector, ou retirez le mod nomm\u00e9 juste au-dessus de l'erreur.
signature.bungee-forwarding-not-enabled.advice=Le proxy transmet la vraie adresse du joueur, mais ce serveur ne l'accepte pas. Mettez settings.bungeecord \u00e0 true dans spigot.yml (et online-mode \u00e0 false), puis red\u00e9marrez.
signature.bungee-forwarding-proxy-side.advice=Ce serveur accepte les adresses transmises, mais le proxy n'en envoie pas. Mettez ip_forward \u00e0 true dans le config.yml du proxy, puis red\u00e9marrez-le.
signature.velocity-backend-online-mode.advice=Le serveur derri\u00e8re le proxy doit tourner avec online-mode=false dans server.properties : c'est le proxy qui v\u00e9rifie l'identit\u00e9 du joueur.
report.hint.silentLag=Les Paper r\u00e9cents n'\u00e9crivent plus \u00ab Can't keep up! \u00bb quand ils prennent du retard : un tick lent ne laisse aucune trace dans le journal. Pendant que \u00e7a rame, lancez : spark profiler start --timeout 60 --save-to-file, puis donnez le profil \u00e0 CrashSleuth.
hang.no-culprit=Le thread principal est bloqu\u00e9 dans le jeu lui-m\u00eame, pas dans un plugin ou un mod : c'est en g\u00e9n\u00e9ral trop d'entit\u00e9s au m\u00eame endroit, un disque tr\u00e8s lent, ou une sauvegarde du monde. Pendant le blocage, lancez spark profiler start --timeout 60 --save-to-file, puis donnez le profil \u00e0 CrashSleuth.
lag.entity-pileup=Un chunk contient tellement d'entit\u00e9s que le jeu a d\u00fb les mettre dans un fichier \u00e0 part. Une foule pareille ralentit chaque tick, m\u00eame sans personne \u00e0 c\u00f4t\u00e9. Allez voir sur place (tuez ou d\u00e9placez ce qui s'est accumul\u00e9), ou arr\u00eatez de garder ce monde charg\u00e9.
signature.world-gen-settings-unreadable.advice=Le fichier qui dit comment ce monde a \u00e9t\u00e9 g\u00e9n\u00e9r\u00e9 a disparu ou est illisible, et le serveur s'arr\u00eate. Restaurez-le depuis une sauvegarde ; d\u00e9marrer avec --safeMode ne contourne pas le probl\u00e8me.
signature.recipe-old-item-stack-format.advice=La recette {0} est \u00e9crite comme avant Minecraft 1.20.5 : dans son r\u00e9sultat, \u00ab item \u00bb doit d\u00e9sormais s'appeler \u00ab id \u00bb. Corrigez ce fichier, ou prenez une version du datapack ou du mod faite pour cette version de Minecraft.
signature.paper-velocity-no-secret.advice=Ce serveur doit se tenir derri\u00e8re un proxy Velocity mais n'a re\u00e7u aucun secret : il a d\u00e9sactiv\u00e9 le transfert et refuse d\u00e9sormais les joueurs du proxy. Recopiez le secret du proxy dans proxies.velocity.secret, ou d\u00e9sactivez la prise en charge Velocity.
signature.rcon-without-password.advice=RCON a \u00e9t\u00e9 demand\u00e9 sans mot de passe : il n'a pas d\u00e9marr\u00e9, et tout ce qui essaie de s'y connecter (panel, outil de sauvegarde) re\u00e7oit un refus. Renseignez rcon.password dans server.properties.
signature.glfw-opengl-too-old.advice=Le pilote graphique n'a pas donn\u00e9 \u00e0 Minecraft la fen\u00eatre qu'il demande : depuis la 1.17, le jeu exige OpenGL 3.2. Mettez le pilote \u00e0 jour (sous Linux, aussi la biblioth\u00e8que Mesa ou constructeur utilis\u00e9e par le lanceur) ; si la carte est vraiment plus ancienne qu'OpenGL 3.2, seules les versions 1.16 et ant\u00e9rieures fonctionneront. La phrase du jeu sur les pilotes \u00e0 jour s'affiche \u00e0 chaque \u00e9chec de fen\u00eatre et ne dit rien de la cause.
signature.model-missing.advice=Un mod\u00e8le de bloc ou d'objet r\u00e9clam\u00e9 par ce pack ou ce mod n'existe pas : ces blocs s'affichent en textures manquantes. Cela ne fait pas planter le jeu : si autre chose s'est cass\u00e9, la cause est ailleurs dans le journal. Corrigez ou retirez le pack qui y fait r\u00e9f\u00e9rence.
