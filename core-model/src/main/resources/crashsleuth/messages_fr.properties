situation.DEP_MISSING.title=Une dépendance obligatoire manque
situation.DEP_MISSING.advice=Installez {0}. Il est exigé par {1}.
situation.DEP_VERSION.title=Une dépendance n'a pas la bonne version
situation.DEP_VERSION.advice={1} a besoin de {0} en version {2}, mais c'est {3} qui est installé. Mettez-le à jour ou changez de version.
situation.DEP_CYCLE.title=Dépendances circulaires
situation.DEP_CYCLE.advice=Ces mods ou plugins dépendent les uns des autres. Mettez-les à jour ou retirez-en un.
situation.WRONG_LOADER.title=Mod fait pour un autre loader
situation.WRONG_LOADER.advice=Retirez {0} : il n'est pas fait pour {1}. Téléchargez la version {1} si elle existe.
situation.WRONG_MC.title=Fait pour une autre version de Minecraft
situation.WRONG_MC.advice=Remplacez {0} par sa version pour Minecraft {1}.
situation.DUPLICATE.title=Installé en double
situation.DUPLICATE.advice=Ne gardez qu'une seule copie de {0}.
situation.JAVA_VERSION.title=Mauvaise version de Java
situation.JAVA_VERSION.advice=Lancez le jeu ou le serveur avec Java {0} ou plus récent (actuellement Java {1}).
situation.CLIENT_ONLY_ON_SERVER.title=Mod client installé sur un serveur
situation.CLIENT_ONLY_ON_SERVER.advice=Retirez {0} du serveur : il ne fonctionne que dans le jeu (client).
situation.MIXIN_CONFLICT.title=Un mod n'a pas réussi à modifier le jeu (mixin)
situation.MIXIN_CONFLICT.advice={0} n'a pas pu appliquer ses modifications au jeu. C'est souvent un conflit avec un autre mod ou une version inadaptée : mettez {0} à jour, puis lancez une recherche du coupable si ça continue.
situation.PLUGIN_API.title=Un plugin ne peut pas se charger
situation.PLUGIN_API.advice=Vérifiez que {0} est fait pour ce logiciel de serveur et cette version de Minecraft, et que ses dépendances sont installées.
situation.CORRUPT_JAR.title=Fichier corrompu
situation.CORRUPT_JAR.advice=Retéléchargez {0} depuis sa page officielle.
situation.CONFIG_BROKEN.title=Fichier de configuration cassé
situation.CONFIG_BROKEN.advice=Supprimez ou corrigez {0} ; il sera recréé avec les valeurs par défaut.
situation.DATAPACK_BROKEN.title=Datapack ou recette cassé
situation.DATAPACK_BROKEN.advice=Retirez ou mettez à jour le datapack ou le mod qui fournit {0}.
situation.REGISTRY_MISMATCH.title=Contenu différent entre client et serveur
situation.REGISTRY_MISMATCH.advice=Installez exactement les mêmes mods, dans les mêmes versions, côté client et côté serveur.
situation.MOD_MISMATCH.title=Mods différents entre client et serveur
situation.MOD_MISMATCH.advice=Installez exactement les mêmes mods, dans les mêmes versions, côté client et côté serveur.
situation.CORRUPT_CHUNK.title=Chunk corrompu
situation.CORRUPT_CHUNK.advice=Restaurez une sauvegarde du monde, ou supprimez le fichier de région autour de {0}.
situation.CORRUPT_ENTITY.title=Entité corrompue
situation.CORRUPT_ENTITY.advice=Supprimez l'entité en {0} (éditeur de monde ou commande /kill) ou restaurez une sauvegarde.
situation.CORRUPT_PLAYERDATA.title=Données de joueur corrompues
situation.CORRUPT_PLAYERDATA.advice=Restaurez le fichier du joueur depuis une sauvegarde, ou supprimez-le (le joueur perd son inventaire).
situation.TICK_ENTITY.title=Crash pendant la mise à jour d'une entité
situation.TICK_ENTITY.advice=L'entité {0} en {1} a fait planter le jeu. {2} est la cause probable : mettez-le à jour, ou supprimez cette entité.
situation.TICK_BLOCK_ENTITY.title=Crash pendant la mise à jour d'un bloc
situation.TICK_BLOCK_ENTITY.advice=Le bloc {0} en {1} a fait planter le jeu. {2} est la cause probable : mettez-le à jour, ou cassez ce bloc.
situation.OUT_OF_MEMORY.title=Mémoire insuffisante
situation.OUT_OF_MEMORY.advice=Donnez plus de mémoire à Java (-Xmx) ou retirez des mods lourds. Un gros modpack demande en général 6 à 10 Go.
situation.STACK_OVERFLOW.title=Boucle infinie (dépassement de pile)
situation.STACK_OVERFLOW.advice={0} est parti dans une boucle infinie. Mettez-le à jour ; si ça continue, signalez-le à son auteur.
situation.RENDER.title=Crash graphique
situation.RENDER.advice=Mettez à jour vos pilotes graphiques, désactivez les shaders et packs de ressources, puis réessayez.
situation.NATIVE_CRASH.title=Crash de Java lui-même
situation.NATIVE_CRASH.advice=Mettez à jour Java et vos pilotes. Le crash s'est produit dans {0}.
situation.HANG.title=Le thread principal est bloqué
situation.HANG.advice={0} bloque le thread principal.
situation.DEADLOCK.title=Deux threads s'attendent mutuellement
situation.DEADLOCK.advice={0} s'attendent l'un l'autre indéfiniment.
situation.LAG.title=Gros lag
situation.LAG.advice={0} utilise l'essentiel du temps de chaque tick.
situation.LOG_SPAM.title=Journal inondé
situation.LOG_SPAM.advice={0} écrit la même erreur en boucle.
situation.SILENT_ERROR.title=Erreur silencieuse
situation.SILENT_ERROR.advice={0} signale une erreur qui ne fait pas planter le jeu mais casse une fonctionnalité.
situation.UNCAUGHT_EXCEPTION.title=Erreur non gérée
situation.UNCAUGHT_EXCEPTION.advice=L'erreur vient de {0}. Mettez-le à jour ; si ça continue, signalez le journal à son auteur.
