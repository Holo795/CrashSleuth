report.environment=Environnement
report.unknown=inconnu
report.noFinding=Aucun problème connu n'a été trouvé.
report.noFindingHint=Lancez une recherche du coupable pour le trouver en lançant le jeu ou le serveur, ou partagez le journal pour qu'une signature soit ajoutée.
report.culprit=Coupable
report.culprits=Coupables
report.confidence=Confiance
