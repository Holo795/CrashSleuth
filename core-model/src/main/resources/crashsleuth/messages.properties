situation.DEP_MISSING.title=A required dependency is missing
situation.DEP_MISSING.advice=Install {0}. It is required by {1}.
situation.DEP_VERSION.title=A dependency has the wrong version
situation.DEP_VERSION.advice={1} needs {0} in version {2}, but {3} is installed. Update or downgrade it.
situation.DEP_CYCLE.title=Circular dependencies
situation.DEP_CYCLE.advice=These mods or plugins depend on each other. Update them or remove one of them.
situation.WRONG_LOADER.title=Mod made for another loader
situation.WRONG_LOADER.advice=Remove {0}: it is not made for {1}. Download the {1} version if it exists.
situation.WRONG_MC.title=Made for another Minecraft version
situation.WRONG_MC.advice={0} is made for Minecraft {2}, but this server runs Minecraft {1}. Download the build of {0} made for Minecraft {1}.
situation.DUPLICATE.title=Installed twice
situation.DUPLICATE.advice={0} is installed more than once ({1}). Keep only the most recent file.
situation.JAVA_VERSION.title=Wrong Java version
situation.JAVA_VERSION.advice=Run the game or server with Java {0} or newer (currently Java {1}).
situation.CLIENT_ONLY_ON_SERVER.title=Client-only mod installed on a server
situation.CLIENT_ONLY_ON_SERVER.advice=Remove {0} from the server: it only works in the game client.
situation.MIXIN_CONFLICT.title=A mod failed to modify the game (mixin)
situation.MIXIN_CONFLICT.advice={0} could not apply its changes to the game. It is often a conflict with another mod or a version mismatch: update {0}, then run a culprit search if it keeps failing.
situation.PLUGIN_API.title=A plugin cannot load
situation.PLUGIN_API.advice=Check that {0} is made for this server software and Minecraft version, and that its dependencies are installed.
situation.CORRUPT_JAR.title=Corrupted file
situation.CORRUPT_JAR.advice=Download {0} again from its official page.
situation.CONFIG_BROKEN.title=Broken configuration file
situation.CONFIG_BROKEN.advice=Delete or fix {0}; it will be regenerated with default values.
situation.DATAPACK_BROKEN.title=A datapack is invalid
situation.DATAPACK_BROKEN.advice=A datapack (or a mod's data) contains a file the game cannot read: {0}. Remove or fix the datapack in the world's datapacks folder.
situation.REGISTRY_MISMATCH.title=Client and server content differ
situation.REGISTRY_MISMATCH.advice=Install exactly the same mods and versions on the client and the server.
situation.MOD_MISMATCH.title=Client and server mods differ
situation.MOD_MISMATCH.advice=Install exactly the same mods and versions on the client and the server.
situation.CORRUPT_CHUNK.title=Corrupted chunk
situation.CORRUPT_CHUNK.advice=Chunk {0} of {1} cannot be read. The game generates it again, and what was built there is lost. Stop the server and restore {1}/{2} from a backup; without one, keep a copy of that file before anything else.
situation.CORRUPT_ENTITY.title=Corrupted entity
situation.CORRUPT_ENTITY.advice=The entities of chunk {0} of {1} (animals, item frames, armor stands, dropped items) cannot be read and are lost when it loads. Stop the server and restore {1}/{2} from a backup.
situation.CORRUPT_PLAYERDATA.title=Corrupted player data
situation.CORRUPT_PLAYERDATA.advice=The save of {0} cannot be read: joining, the player starts over with an empty inventory. Stop the server, then restore that file from a backup, or rename the previous save <uuid>.dat_old to <uuid>.dat if it exists.
situation.TICK_ENTITY.title=Crash while updating an entity
situation.TICK_ENTITY.advice=The entity {0} at {1} made the game crash. {2} is the likely cause: update it, or remove that entity.
situation.TICK_BLOCK_ENTITY.title=Crash while updating a block
situation.TICK_BLOCK_ENTITY.advice=The block {0} at {1} made the game crash. {2} is the likely cause: update it, or break that block.
situation.OUT_OF_MEMORY.title=Out of memory
situation.OUT_OF_MEMORY.advice=Give Java more memory (-Xmx), or remove heavy mods. A large modpack usually needs 6 to 10 GB.
situation.STACK_OVERFLOW.title=Infinite loop (stack overflow)
situation.STACK_OVERFLOW.advice={0} ran into an infinite loop. Update it; if it persists, report it to its author.
situation.RENDER.title=Graphics problem
situation.RENDER.advice=Update your graphics drivers, disable shaders and resource packs, then try again.
situation.NATIVE_CRASH.title=Crash of Java itself
situation.NATIVE_CRASH.advice=Update Java and your drivers. The crash happened in {0}.
situation.HANG.title=The main thread is stuck
situation.HANG.advice={0} is blocking the main thread: the server freezes and the watchdog ends up stopping it. Update or remove {0}.
situation.DEADLOCK.title=Two threads wait for each other
situation.DEADLOCK.advice={0} holds a lock that another of its threads waits for, while that thread holds the one the main thread waits for: the server is frozen for good and the watchdog stops it. Report it to the author of {0} with this log, and update or remove it.
situation.LAG.title=Heavy lag
situation.LAG.advice={0} uses most of the tick time.
situation.LOG_SPAM.title=The log is flooded
situation.LOG_SPAM.advice={0} writes the same error over and over.
situation.SILENT_ERROR.title=Silent error
situation.SILENT_ERROR.advice={0} failed {1} time(s) while the server was running. Nothing crashed, but the feature it provides is broken: update {0} or report the error to its author.
situation.UNCAUGHT_EXCEPTION.title=Unhandled error
situation.UNCAUGHT_EXCEPTION.advice=The error comes from {0}. Update it; if it persists, report the log to its author.
situation.MOD_CONFLICT.title=Incompatible mods
situation.MOD_CONFLICT.advice={0} cannot run together with {1}. Remove one of them, or look for versions that work together.
situation.WORLD_DOWNGRADE.title=World opened with an older Minecraft
situation.WORLD_DOWNGRADE.advice=This world was saved by a newer Minecraft ({0}) than the server ({1}). Update the server, or restore a backup made before the upgrade: a world cannot go back to an older version.
situation.WORLD_DUPLICATE.title=Two worlds with the same identity
situation.WORLD_DUPLICATE.advice={0} is a copy of another world. Delete the uid.dat file inside the {0} folder, then restart.
signature.world-missing-mod.advice=The world contains content from {0}, which is no longer installed. Reinstall {0}, or accept that its blocks and items will disappear (make a backup first).
signature.world-mod-version.advice=The world was saved with another version of {0}. Check the changelog of {0} before playing, and keep a backup.
signature.fml-confirm.advice=The world references blocks or items that no longer exist (a mod was removed or changed). The server waits for /fml confirm: make a backup, then confirm, or reinstall the missing mod.
signature.authme-shutdown.advice=AuthMe stops the server on purpose, usually because it cannot reach its database. Check the database settings in the AuthMe configuration.
report.skipped={0} file(s) of the pack could not be checked ({1}): CurseForge only serves files through its API. Check the installed folder instead.
bisect.notReproduced=The server started normally with all its mods and plugins: there is nothing to search. If the crash happens later in the game, try again with --with-world and a longer --settle.
bisect.reproduced=Crash reproduced
bisect.unexplained=the server stops without any explanation in its logs
bisect.single=Culprit found: {0}. The server crashes with it alone and starts without it.
bisect.combination=The crash needs all of these together: {0}. Each set without one of them starts normally: they are incompatible with each other.
bisect.incomplete=The limit of {0} launches was reached before the end. The culprit is among: {1}. Run again with a higher --max-runs.
bisect.cost={0} launches, {1} minutes.
signature.paper-remap-failed.advice={0} is not loaded at all: Paper could not prepare it, because its remapper cannot read some of its classes (compiled for a newer Java). The server starts, but without {0}. Install the version of {0} made for this Minecraft version, or update Paper.
mixin.suspects.advice=The error happened in Minecraft code that {0} changes through mixins: it is the first suspect, not a proof. Confirm with crashsleuth bisect.
situation.EULA.title=The Minecraft EULA is not accepted
situation.EULA.advice=Open eula.txt in the server folder and set eula=true, after reading https://aka.ms/MinecraftEULA. The server stops at start until then.
situation.PORT_IN_USE.title=The server port is already taken
situation.PORT_IN_USE.advice=Another program (often a second copy of the server) already uses this port. Stop it, or change server-port in server.properties.
situation.DISK_FULL.title=The disk is full
situation.DISK_FULL.advice=The server cannot write its files any more. Free some space (old backups, logs, crash reports) before starting it again, or the world may be damaged.
situation.JVM_OPTIONS.title=Java refuses the start options
situation.JVM_OPTIONS.advice=The start command or user_jvm_args.txt contains an option this Java does not accept. Remove or fix it.
situation.WORLD_LOCKED.title=The world is already in use
situation.WORLD_LOCKED.advice=Another server (or a copy of this one that did not stop) holds the world {0}. Stop it before starting this one; never run two servers on the same world.
situation.WORLD_CORRUPT.title=The world file is damaged
situation.WORLD_CORRUPT.advice=level.dat of {0} cannot be read. Restore it from a backup, or rename level.dat_old to level.dat if it exists (it is the previous save).
signature.heap-too-big.advice=Java cannot get the memory asked by -Xmx: the computer or the container has less. Lower -Xmx in the start command or user_jvm_args.txt.
signature.config-broken.advice=The configuration of {0} cannot be read. Delete the file so it is created again with default values, or fix the line shown in the evidence.
situation.OUTDATED.title=A newer version exists
situation.OUTDATED.advice=A newer version of {0} exists for this game and loader ({1}). Updates often fix crashes: read its changelog before updating.
compare.missing-on-player=The server has {0}, which adds blocks and items, but the player does not: the game refuses to connect. Install the same version of {0} on the player's game.
compare.missing-on-server=The player has {0}, which adds blocks and items, but the server does not: the game refuses to connect. Remove {0} from the player's game, or install it on the server.
compare.version=The player has {0}, the server has version {2}. Install the same version on both sides.
compare.loader=The player uses {1} and the server {2}: mods of one loader do not connect to the other. Use the server's loader.
compare.minecraft=The player runs Minecraft {1} and the server Minecraft {2}. Start the game in the server's version.
situation.PROXY_FORWARDING.title=The proxy and the server do not trust each other
situation.PROXY_FORWARDING.advice=The proxy forwards players with a secret that the server does not accept, or in a mode it does not expect. Put the same forwarding secret in the proxy (forwarding.secret) and in the server (config/paper-global.yml, proxies.velocity.secret), and use the same forwarding mode on both sides.
situation.PROXY_BACKEND.title=The proxy cannot reach the server
situation.PROXY_BACKEND.advice=The proxy could not connect to {0}. Start that server, and check the address and port in the proxy configuration (velocity.toml [servers] or config.yml).
situation.CONNECTION_LOST.title=The player was disconnected
situation.CONNECTION_LOST.advice=The connection was closed: {1}. Check the reason in the evidence; if it names a mod or a registry, compare the mods of the player and of the server.
signature.registry-unknown.advice=The server has mods that add blocks or items the player does not have. Install on the player's game the same content mods, in the same versions, as the server; comparing both folders names them.
lag.no-profile=The server fell up to {5} ms behind ({6}\u00d7 once started): something takes too long at each tick. The log cannot say what: while it lags, run spark profiler start --timeout 60 --save-to-file in the console, then give the saved .sparkprofile (plugins/spark or config/spark) to CrashSleuth.
lag.profile={0} takes {3} % of the main thread's time (mostly in {4}). Check its settings (intervals, radius, amounts), update it, or remove it to confirm.
signature.killed.advice=The system killed Java: the machine or the container has less memory than Java was allowed to take (-Xmx, plus about 1 GB for Java itself). Lower -Xmx, or give the container more memory.
render.pack-unreadable=The resource pack {0} is not a pack the game can open (a damaged download, or a folder zipped one level too deep). The game removed it from its options. Download it again; a pack.mcmeta file must be at the root of the zip.
render.pack-broken=Files of {0} cannot be read (models or block states with broken JSON, seen {6} times): those blocks or items show as missing. Update the pack, or remove it to confirm.
render.shaderpack=The shader pack {0} does not compile on this computer ({4}), so Iris turned shaders off. Update the pack, pick a version made for this Iris, or update the graphics driver.
signature.natives-missing.advice=The game's native libraries (LWJGL) are missing for this system: Minecraft does not provide them for every computer (Linux on ARM, for instance). Use a launcher that supplies them for this system (Prism Launcher does), or a computer with an x86-64 processor.
report.explanation=In plain words (local AI, it can be wrong: the diagnosis above is the reference):
report.explanation.none=No local AI answered at {0}. Start Ollama with a model, or set CRASHSLEUTH_AI_URL to your local server.
proxy.waterfall-eol=Waterfall is no longer maintained (PaperMC ended it in 2024) and gets no fixes: in a test it left a player waiting without any message when its server was down. Move to Velocity.
render.drawing={0} crashed the game while it was drawing the world ({4}). Remove it to play again, then update it or report the crash to its author with this report.
render.what.blocks=the blocks
render.what.entity=an entity
render.what.block entity=a block entity
render.what.screen=the interface
render.what.item=an item
ai.invented=CrashSleuth does not know these, so do not act on them: {0}
advice.folia.unsupported=Only plugins that say folia-supported load on Folia. Ask the author of {0} for a Folia build, or run Paper instead.
advice.plugin.old-internals={0} looks inside the server for something this Minecraft version no longer has: it was made for another one. Update {0}, or run the version it supports.
signature.velocity-secret-file-empty.advice=The file named by forwarding-secret-file (forwarding.secret) is empty. Write the same secret in it as in the servers behind the proxy, or set player-info-forwarding-mode to none.
signature.velocity-config-unreadable.advice=Velocity could not read velocity.toml and stopped. Fix the line it names, or delete the file so Velocity writes a new one.
signature.forge-language-provider-version.advice={0} asks for a language provider that this build of NeoForge or Forge does not ship: it was made for another loader build. Install the loader version it names, or update the mod.
signature.jar-invalid-or-corrupt.advice=That jar is not a whole file: the download stopped halfway. Delete it and download it again.
signature.file-access-denied.advice=The server is not allowed to read or write that file. Give it to the user the server runs as (chown), or, in a container, set UID and GID to the owner of the folder.
signature.mod-metadata-invalid.advice=The loader cannot read what {0} says about itself: that build was published broken. Take another version of it, or tell its author.
signature.connector-locator-error.advice=Connector could not read one of the Fabric mods it was meant to convert, so nothing loaded. Take a newer Connector build, or remove the mod named just above this error.
signature.bungee-forwarding-not-enabled.advice=The proxy forwards the player's real address, but this server does not accept it. Set settings.bungeecord to true in spigot.yml (and online-mode to false), then restart.
signature.bungee-forwarding-proxy-side.advice=This server accepts forwarded addresses, but the proxy does not send them. Set ip_forward to true in the proxy's config.yml, then restart it.
signature.velocity-backend-online-mode.advice=The server behind the proxy must run with online-mode=false in server.properties: the proxy is the one that checks who the player is.
report.hint.silentLag=Recent Paper servers no longer write "Can't keep up!" when they fall behind, so a slow tick leaves nothing in the log. While it is slow, run: spark profiler start --timeout 60 --save-to-file, then give CrashSleuth the profile it saves.
hang.no-culprit=The main thread is stuck inside the game itself, not inside a plugin or a mod: that usually means too many entities in one place, a very slow disk, or a world being saved. While it is stuck, run spark profiler start --timeout 60 --save-to-file, then give CrashSleuth the profile.
lag.entity-pileup=One chunk holds so many entities that the game had to keep them in a file of their own. A crowd like that slows every tick, even with nobody nearby. Go there and look (kill or move what piled up), or stop that world from being kept loaded.
signature.world-gen-settings-unreadable.advice=The file that says how this world was generated is gone or unreadable, so the server stops. Restore it from a backup; starting with --safeMode does not get around it.
signature.recipe-old-item-stack-format.advice=The recipe {0} is written the way recipes were before Minecraft 1.20.5: in its result, "item" must now be "id". Fix that file, or take a version of the datapack or mod made for this Minecraft.
signature.paper-velocity-no-secret.advice=This server was told to sit behind a Velocity proxy but given no secret, so it turned that off and now refuses the proxy's players. Copy the proxy's forwarding secret into proxies.velocity.secret, or turn Velocity support off.
signature.rcon-without-password.advice=RCON was asked for without a password, so it never started: anything trying to reach it (a panel, a backup tool) gets a refused connection. Set rcon.password in server.properties.
signature.glfw-opengl-too-old.advice=The graphics driver would not give Minecraft the kind of window it needs: since 1.17 the game requires OpenGL 3.2. Update the graphics driver (on Linux, also the Mesa or vendor runtime your launcher uses); if the card is genuinely older than OpenGL 3.2, only Minecraft 1.16 and below will run. The game's own "up-to-date drivers" line is printed for every window failure and is not a diagnosis.
signature.velocity-required-by-backend.advice=The server only accepts players sent by a Velocity proxy, and this one arrived without that. Set player-info-forwarding-mode to "modern" on the proxy and give both sides the same secret (and save the file before restarting); or, if there is no proxy, turn Velocity support off in config/paper-global.yml.
signature.resource-pack-dropped.advice=The game removed that resource pack by itself: the pack says which Minecraft it was made for (pack_format) and it is not this one. Take the build of the pack for the version you play; nothing is broken, the pack is simply not applied.
signature.java-options-environment-override.advice=Java was given options through an environment variable, and those are applied after the command line, so they win. If it carries -Xmx, the memory you set in the launcher or the start script is not the memory the game got: check the real limit in the report, then remove the variable (tools such as Razer Synapse set it) instead of raising the number again.
signature.forge-removes-erroring-entities.advice=This server is set to delete anything that fails while ticking instead of stopping. Whatever it removes is gone for good, and the real cause is never fixed. Turn removeErroringEntities and removeErroringBlockEntities back off in the Forge config, then look at the crash report it was hiding.
hang.idle-thread=The watchdog complained while the server thread was simply waiting for its next tick: nothing was stuck. That happens when the clock of the machine jumps, which is common on a virtual machine. Check the host's clock and the virtualisation software before looking for a culprit.
hang.idle-thread.title=The watchdog complained while nothing was stuck
silent.registered-by={0} is the code that failed while the server ran. The line in the log names the plugin that registered it, which is not the same thing: update or report {0}, and only suspect the other one if that leads nowhere.
