situation.DEP_MISSING.title=A required dependency is missing
situation.DEP_MISSING.advice=Install {0}. It is required by {1}.
situation.DEP_VERSION.title=A dependency has the wrong version
situation.DEP_VERSION.advice={1} needs {0} in version {2}, but {3} is installed. Update or downgrade it.
situation.DEP_CYCLE.title=Circular dependencies
situation.DEP_CYCLE.advice=These mods or plugins depend on each other. Update them or remove one of them.
situation.WRONG_LOADER.title=Mod made for another loader
situation.WRONG_LOADER.advice=Remove {0}: it is not made for {1}. Download the {1} version if it exists.
situation.WRONG_MC.title=Made for another Minecraft version
situation.WRONG_MC.advice=Replace {0} with the build made for Minecraft {1}.
situation.DUPLICATE.title=Installed twice
situation.DUPLICATE.advice=Keep only one copy of {0}.
situation.JAVA_VERSION.title=Wrong Java version
situation.JAVA_VERSION.advice=Run the game or server with Java {0} or newer (currently Java {1}).
situation.CLIENT_ONLY_ON_SERVER.title=Client-only mod installed on a server
situation.CLIENT_ONLY_ON_SERVER.advice=Remove {0} from the server: it only works in the game client.
situation.MIXIN_CONFLICT.title=A mod failed to modify the game (mixin)
situation.MIXIN_CONFLICT.advice={0} could not apply its changes to the game. It is often a conflict with another mod or a version mismatch: update {0}, then run a culprit search if it keeps failing.
situation.PLUGIN_API.title=A plugin cannot load
situation.PLUGIN_API.advice=Check that {0} is made for this server software and Minecraft version, and that its dependencies are installed.
situation.CORRUPT_JAR.title=Corrupted file
situation.CORRUPT_JAR.advice=Download {0} again from its official page.
situation.CONFIG_BROKEN.title=Broken configuration file
situation.CONFIG_BROKEN.advice=Delete or fix {0}; it will be regenerated with default values.
situation.DATAPACK_BROKEN.title=Broken datapack or recipe
situation.DATAPACK_BROKEN.advice=Remove or update the datapack or mod that provides {0}.
situation.REGISTRY_MISMATCH.title=Client and server content differ
situation.REGISTRY_MISMATCH.advice=Install exactly the same mods and versions on the client and the server.
situation.MOD_MISMATCH.title=Client and server mods differ
situation.MOD_MISMATCH.advice=Install exactly the same mods and versions on the client and the server.
situation.CORRUPT_CHUNK.title=Corrupted chunk
situation.CORRUPT_CHUNK.advice=Restore a backup of the world, or delete the region file around {0}.
situation.CORRUPT_ENTITY.title=Corrupted entity
situation.CORRUPT_ENTITY.advice=Remove the entity at {0} (with a world editor or a /kill command) or restore a backup.
situation.CORRUPT_PLAYERDATA.title=Corrupted player data
situation.CORRUPT_PLAYERDATA.advice=Restore the player file from a backup, or delete it (the player loses their inventory).
situation.TICK_ENTITY.title=Crash while updating an entity
situation.TICK_ENTITY.advice=The entity {0} at {1} made the game crash. {2} is the likely cause: update it, or remove that entity.
situation.TICK_BLOCK_ENTITY.title=Crash while updating a block
situation.TICK_BLOCK_ENTITY.advice=The block {0} at {1} made the game crash. {2} is the likely cause: update it, or break that block.
situation.OUT_OF_MEMORY.title=Out of memory
situation.OUT_OF_MEMORY.advice=Give Java more memory (-Xmx), or remove heavy mods. A large modpack usually needs 6 to 10 GB.
situation.STACK_OVERFLOW.title=Infinite loop (stack overflow)
situation.STACK_OVERFLOW.advice={0} ran into an infinite loop. Update it; if it persists, report it to its author.
situation.RENDER.title=Graphics crash
situation.RENDER.advice=Update your graphics drivers, disable shaders and resource packs, then try again.
situation.NATIVE_CRASH.title=Crash of Java itself
situation.NATIVE_CRASH.advice=Update Java and your drivers. The crash happened in {0}.
situation.HANG.title=The main thread is stuck
situation.HANG.advice={0} is blocking the main thread.
situation.DEADLOCK.title=Two threads wait for each other
situation.DEADLOCK.advice={0} are waiting for each other forever.
situation.LAG.title=Heavy lag
situation.LAG.advice={0} uses most of the tick time.
situation.LOG_SPAM.title=The log is flooded
situation.LOG_SPAM.advice={0} writes the same error over and over.
situation.SILENT_ERROR.title=Silent error
situation.SILENT_ERROR.advice={0} reports an error that does not crash the game but breaks a feature.
situation.UNCAUGHT_EXCEPTION.title=Unhandled error
situation.UNCAUGHT_EXCEPTION.advice=The error comes from {0}. Update it; if it persists, report the log to its author.
