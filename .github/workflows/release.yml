name: release

# A tag like v1.0.0 builds the app on the three systems and publishes one release with every file.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            format: packageDeb
            artifacts: desktop/build/compose/binaries/main/deb/*.deb
          - os: windows-latest
            name: windows-x64
            format: packageMsi
            artifacts: desktop/build/compose/binaries/main/msi/*.msi
          - os: macos-latest
            name: macos-arm64
            format: packageDmg
            artifacts: desktop/build/compose/binaries/main/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Version from the tag
        shell: bash
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the app
        shell: bash
        run: ./gradlew :desktop:${{ matrix.format }} -Pversion="$VERSION" --no-daemon

      # The same name on the three systems, so the wiki can link to a file it can predict.
      - name: Name the file
        shell: bash
        run: |
          mkdir -p out
          for file in ${{ matrix.artifacts }}; do
            extension="${file##*.}"
            cp "$file" "out/CrashSleuth-$VERSION-${{ matrix.name }}.$extension"
          done
          ls -la out

      # The command line tool and the folder of jars run on any system with Java 21: built once, on Linux.
      - name: Build the command line and the portable app
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          ./gradlew :cli:distZip :desktop:portable -Pversion="$VERSION" --no-daemon
          cp cli/build/distributions/*.zip "out/CrashSleuth-cli-$VERSION.zip"
          (cd desktop/build/portable && zip -qr "$GITHUB_WORKSPACE/out/CrashSleuth-portable-$VERSION.zip" lib)

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: out/*

  publish:
    needs: build
    # A manual run is a dry run: it builds everything and stops. Only a tag publishes.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          path: files
      - name: Checksums
        run: |
          find files -type f -exec mv {} . \;
          sha256sum CrashSleuth-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            CrashSleuth-*
            SHA256SUMS.txt
          generate_release_notes: true
          body_path: .github/release-body.md
