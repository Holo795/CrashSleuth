name: scout

# Every Monday: read the public Minecraft problem reports of the week, and open one issue listing the ones
# CrashSleuth says nothing about. It proposes; a person decides what, if anything, becomes a rule.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to read"
        default: "7"

permissions:
  contents: read
  issues: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # The tool as it is on main today: what it would answer if someone pasted these logs now.
      - name: Build the command line
        run: ./gradlew :cli:installDist --no-daemon

      - name: Read the week's reports
        id: scout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          python3 scout/scout.py
          --cli cli/build/install/crashsleuth/bin/crashsleuth
          --days "${{ inputs.days || '7' }}"
          --out scout-report.md

      - name: Open the issue
        if: steps.scout.outputs.candidates != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create scout --color C5DEF5 \
            --description "Reports the weekly scout found CrashSleuth silent about" 2>/dev/null || true
          gh issue create \
            --title "Scout $(date +%F): ${{ steps.scout.outputs.candidates }} reports CrashSleuth said nothing about" \
            --label scout \
            --body-file scout-report.md

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: scout-report
          path: scout-report.md
