name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Every change is built and tested on the three systems CrashSleuth runs on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # bash on every system, Git Bash on Windows: one command line for the three.
      - run: ./gradlew build --no-daemon
        shell: bash
